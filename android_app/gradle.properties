# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Enable R8 full mode
android.enableR8.fullMode=true

android.nonTransitiveRClass=true

# KSP (needed for Room) flatly refuses to run under AGP 9's built-in Kotlin
# support as of the version pinned in libs.versions.toml ("KSP is not
# compatible with Android Gradle Plugin's built-in Kotlin" is its own error
# message) — so built-in Kotlin is turned off here and the classic
# org.jetbrains.kotlin.android plugin is applied instead (see app/build.gradle.kts).
android.builtInKotlin=false
# The classic org.jetbrains.kotlin.android plugin also can't attach to AGP 9.2's
# new `android{}` extension type by default — this drops back to the old
# extension type so the classic plugin (and therefore KSP) works normally.
android.newDsl=false
